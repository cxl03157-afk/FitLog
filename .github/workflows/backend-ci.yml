name: Backend CI

on:
  push:
    # docs/** ブランチへの push は paths フィルターで自動除外（backend/** に非該当）
    branches: [main, "feature/**", "fix/**", "refactor/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitlog
          POSTGRES_PASSWORD: fitlog
          POSTGRES_DB: fitlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitlog -d fitlog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: fitlog
      DB_PASSWORD: fitlog
      DB_NAME: fitlog
      JWT_SECRET: test-secret
      FRONTEND_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run migrations
        working-directory: backend
        run: npm run migration:run

      - name: Test
        working-directory: backend
        run: npm test
