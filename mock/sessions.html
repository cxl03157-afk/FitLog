<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>デバイス管理 — FitLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <div id="nav"></div>
  <main class="max-w-2xl mx-auto px-6 py-8">
    <a href="profile.html" class="text-sm text-indigo-600 mb-4 inline-block">← プロフィール</a>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">ログイン中のデバイス</h1>
    <p class="text-sm text-gray-500 mb-6">不明なデバイスはログアウトしてください。</p>
    <div id="session-list" class="space-y-4 mb-8"></div>
    <button type="button" onclick="if(confirm('他のすべてのデバイスからログアウトしますか？')) location.href='login.html'" class="w-full py-2.5 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 font-medium">他のすべてのデバイスからログアウト</button>
  </main>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderNav('profile');
    document.getElementById('session-list').innerHTML = MOCK_SESSIONS.map(s => `
      <div class="bg-white border border-gray-200 rounded-xl p-5 flex items-center justify-between">
        <div>
          <p class="font-semibold flex items-center gap-2">${s.deviceName} ${s.current ? '<span class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">このデバイス</span>' : ''}</p>
          <p class="text-sm text-gray-500">最終利用: ${s.lastUsed}</p>
          <p class="text-xs text-gray-400">IP: ${s.ip}</p>
        </div>
        ${!s.current ? `<button type="button" onclick="this.closest('div.bg-white').remove()" class="text-sm px-3 py-1.5 text-red-600 border border-red-200 rounded-lg hover:bg-red-50">ログアウト</button>` : ''}
      </div>
    `).join('');
  </script>
</body>
</html>
