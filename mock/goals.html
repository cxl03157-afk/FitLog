<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>目標 — FitLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <div id="nav"></div>
  <main class="max-w-3xl mx-auto px-6 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-900">トレーニング目標</h1>
      <button type="button" id="open-add" class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700">+ 目標を追加</button>
    </div>
    <div id="goal-list" class="space-y-4"></div>
  </main>
  <div id="goal-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 shadow-xl">
      <h2 id="modal-title" class="text-lg font-bold mb-4">新しい目標</h2>
      <form id="goal-form" class="space-y-3">
        <input type="hidden" id="goal-id" />
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">種目</label>
          <select id="goal-exercise" required class="w-full px-3 py-2 border rounded-lg"></select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">目標重量 (kg)</label>
            <input type="number" id="goal-weight" min="0" step="0.5" required class="w-full px-3 py-2 border rounded-lg" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">目標回数</label>
            <input type="number" id="goal-reps" min="1" required class="w-full px-3 py-2 border rounded-lg" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">期限</label>
          <input type="date" id="goal-deadline" required class="w-full px-3 py-2 border rounded-lg" />
        </div>
        <div id="status-field" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">状態</label>
          <select id="goal-status" class="w-full px-3 py-2 border rounded-lg">
            <option value="IN_PROGRESS">進行中</option>
            <option value="ACHIEVED">達成</option>
            <option value="ABANDONED">中止</option>
          </select>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg">保存</button>
          <button type="button" id="delete-goal" class="hidden py-2 px-3 bg-red-50 text-red-600 rounded-lg hover:bg-red-100">削除</button>
          <button type="button" id="close-modal" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded-lg">キャンセル</button>
        </div>
      </form>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/store.js?v=5"></script>
  <script src="js/common.js?v=10"></script>
  <script>
    renderNav('goals');
    const modal = document.getElementById('goal-modal');
    const exerciseSelect = document.getElementById('goal-exercise');
    exerciseSelect.innerHTML = MOCK_EXERCISES.map((ex) => `<option value="${ex.name}">${ex.name}</option>`).join('');

    function renderGoals() {
      const goals = getGoals();
      document.getElementById('goal-list').innerHTML = goals.length
        ? goals.map((g) => `
          <div class="bg-white rounded-xl border border-gray-200 p-5 flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <h3 class="font-semibold text-lg">${g.exercise}</h3>
                ${goalStatusBadge(g)}
              </div>
              <p class="text-gray-600">${g.targetWeight} kg × ${g.targetReps} 回</p>
              <p class="text-sm text-gray-400">期限: ${g.deadline}</p>
              ${goalProgressHtml(g)}
              ${g.status === 'IN_PROGRESS' ? `
                <div class="flex gap-2 mt-2">
                  <button type="button" data-action="achieve" data-id="${g.id}" class="text-xs text-green-600 hover:underline">達成にする</button>
                  <button type="button" data-action="abandon" data-id="${g.id}" class="text-xs text-gray-500 hover:underline">中止する</button>
                </div>
              ` : ''}
            </div>
            <div class="flex flex-col items-end gap-2 shrink-0">
              <button type="button" data-edit-id="${g.id}" class="text-sm text-indigo-600 hover:underline">編集</button>
              <button type="button" data-delete-id="${g.id}" class="text-sm text-red-600 hover:underline">削除</button>
            </div>
          </div>
        `).join('')
        : '<p class="text-gray-500 text-center py-8">目標がありません。追加してください。</p>';

      document.querySelectorAll('[data-edit-id]').forEach((btn) => {
        btn.onclick = () => openModal(Number(btn.dataset.editId));
      });
      document.querySelectorAll('[data-delete-id]').forEach((btn) => {
        btn.onclick = () => {
          const id = Number(btn.dataset.deleteId);
          const g = getGoals().find((x) => x.id === id);
          if (g && confirm(`「${g.exercise}」の目標を削除しますか？`)) {
            deleteGoal(id);
            renderGoals();
          }
        };
      });
      document.querySelectorAll('[data-action]').forEach((btn) => {
        btn.onclick = () => {
          const id = Number(btn.dataset.id);
          const g = getGoals().find((x) => x.id === id);
          if (!g) return;
          if (btn.dataset.action === 'abandon') {
            if (!confirm(`「${g.exercise}」の目標を中止しますか？`)) return;
            updateGoal(id, { status: 'ABANDONED' });
          } else {
            updateGoal(id, { status: 'ACHIEVED' });
          }
          renderGoals();
        };
      });
    }

    function openModal(goalId) {
      document.getElementById('goal-id').value = goalId || '';
      document.getElementById('modal-title').textContent = goalId ? '目標を編集' : '新しい目標';
      document.getElementById('status-field').classList.toggle('hidden', !goalId);
      document.getElementById('delete-goal').classList.toggle('hidden', !goalId);
      if (goalId) {
        const g = getGoals().find((x) => x.id === goalId);
        document.getElementById('goal-exercise').value = g.exercise;
        document.getElementById('goal-weight').value = g.targetWeight;
        document.getElementById('goal-reps').value = g.targetReps;
        document.getElementById('goal-deadline').value = g.deadline;
        document.getElementById('goal-status').value = g.status;
      } else {
        document.getElementById('goal-form').reset();
        document.getElementById('goal-deadline').value = '';
      }
      modal.classList.remove('hidden');
    }

    document.getElementById('open-add').onclick = () => openModal(null);
    document.getElementById('close-modal').onclick = () => modal.classList.add('hidden');
    document.getElementById('delete-goal').onclick = () => {
      const id = Number(document.getElementById('goal-id').value);
      const g = getGoals().find((x) => x.id === id);
      if (g && confirm(`「${g.exercise}」の目標を削除しますか？`)) {
        deleteGoal(id);
        modal.classList.add('hidden');
        renderGoals();
      }
    };
    document.getElementById('goal-form').onsubmit = (e) => {
      e.preventDefault();
      const data = {
        exercise: document.getElementById('goal-exercise').value,
        targetWeight: parseFloat(document.getElementById('goal-weight').value),
        targetReps: parseInt(document.getElementById('goal-reps').value, 10),
        deadline: document.getElementById('goal-deadline').value,
      };
      const id = document.getElementById('goal-id').value;
      if (id) {
        data.status = document.getElementById('goal-status').value;
        updateGoal(Number(id), data);
      } else {
        addGoal(data);
      }
      modal.classList.add('hidden');
      renderGoals();
    };

    renderGoals();
  </script>
</body>
</html>
