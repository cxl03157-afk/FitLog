<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フォロー中 — FitLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <div id="nav"></div>
  <main class="max-w-2xl mx-auto px-6 py-8">
    <a href="profile.html" class="text-sm text-indigo-600 mb-4 inline-block">← プロフィール</a>
    <h1 id="page-title" class="text-xl font-bold mb-4">つながり</h1>
    <div class="flex gap-2 mb-6 border-b border-gray-200">
      <a href="followers.html" class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">フォロワー</a>
      <a href="following.html" class="px-4 py-2 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600">フォロー中</a>
    </div>
    <div id="user-list" class="space-y-3"></div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/store.js?v=5"></script>
  <script src="js/common.js?v=9"></script>
  <script>
    renderNav('profile');
    const listEl = document.getElementById('user-list');
    bindFollowButtons(listEl, () => renderFollowingList());

    function renderFollowingList() {
      const currentUser = getCurrentUser();
      document.getElementById('page-title').textContent = currentUser.displayName + ' のつながり';
      const following = getFollowingUserIds().map((id) => getUserById(id)).filter(Boolean);
      listEl.innerHTML = following.length ? following.map((u) => `
        <div class="flex items-center justify-between bg-white border border-gray-200 rounded-xl p-4">
          <a href="profile.html?user=${u.id}" class="flex items-center gap-3 hover:opacity-80">
            ${avatarHtml(u.avatarColor)}
            <div>
              <p class="font-semibold">${u.displayName}</p>
              <p class="text-sm text-gray-500">@${u.username}</p>
            </div>
          </a>
          ${followButtonHtml(u.id, true)}
        </div>
      `).join('') : '<p class="text-gray-500 text-center py-8">フォロー中のユーザーはいません</p>';
    }

    renderFollowingList();
    window.addEventListener('pageshow', () => renderFollowingList());
  </script>
</body>
</html>
