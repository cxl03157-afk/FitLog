<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン — FitLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">
  <main class="w-full max-w-md px-6">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-2xl font-bold text-indigo-600 text-center mb-2">FitLog</h1>
      <p class="text-gray-500 text-center text-sm mb-8">トレーニング記録を共有しよう</p>
      <p id="form-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></p>
      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
          <input type="email" id="email" value="tanaka@example.com" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
          <input type="password" id="password" value="password" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors">ログイン</button>
      </form>
      <p class="mt-6 text-center text-sm text-gray-600">
        アカウントをお持ちでない方は
        <a href="register.html" class="text-indigo-600 font-medium hover:underline">アカウントを作成</a>
      </p>
      <p class="mt-4 text-center">
        <a href="login.html?reset=1" class="text-xs text-gray-400 hover:text-gray-600 hover:underline">モックデータをリセット</a>
      </p>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/store.js?v=5"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('form-error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const result = loginUser({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      if (result.error) {
        errorEl.textContent = result.error;
        errorEl.classList.remove('hidden');
        return;
      }
      window.location.href = 'timeline.html';
    });
  </script>
</html>
