<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新規登録 — FitLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">
  <main class="w-full max-w-md px-6">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-2xl font-bold text-indigo-600 text-center mb-2">FitLog</h1>
      <p class="text-gray-500 text-center text-sm mb-8">新規アカウント作成</p>
      <p id="form-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></p>
      <form id="register-form" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">ユーザー名</label>
          <input type="text" id="username" name="username" placeholder="tanaka_fit" required pattern="[a-zA-Z0-9_]{3,20}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
          <p class="text-xs text-gray-400 mt-1">半角英数字とアンダースコア（3〜20文字）</p>
        </div>
        <div>
          <label for="display-name" class="block text-sm font-medium text-gray-700 mb-1">表示名</label>
          <input type="text" id="display-name" name="displayName" placeholder="田中 健太" required maxlength="50" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
          <input type="email" id="email" name="email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード（8文字以上）</label>
          <input type="password" id="password" name="password" required minlength="8" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label for="password-confirm" class="block text-sm font-medium text-gray-700 mb-1">パスワード（確認）</label>
          <input type="password" id="password-confirm" name="passwordConfirm" required minlength="8" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">登録する</button>
      </form>
      <p class="mt-6 text-center text-sm text-gray-600">
        既にアカウントをお持ちの方は
        <a href="login.html" class="text-indigo-600 font-medium hover:underline">ログインはこちら</a>
      </p>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/store.js?v=5"></script>
  <script>
    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('form-error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password-confirm').value;
      if (password !== passwordConfirm) {
        errorEl.textContent = 'パスワードが一致しません。もう一度入力してください';
        errorEl.classList.remove('hidden');
        return;
      }
      const result = registerUser({
        username: document.getElementById('username').value,
        displayName: document.getElementById('display-name').value,
        email: document.getElementById('email').value,
        password,
      });
      if (result.error) {
        errorEl.textContent = result.error;
        errorEl.classList.remove('hidden');
        return;
      }
      window.location.href = 'timeline.html';
    });
  </script>
</body>
</html>
