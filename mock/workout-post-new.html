<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>トレーニング記録 — FitLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <div id="nav"></div>
  <main class="max-w-3xl mx-auto px-6 py-8">
    <h1 id="page-title" class="text-2xl font-bold text-gray-900 mb-6">トレーニング記録を投稿</h1>
    <form id="post-form" class="space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">タイトル</label>
          <input type="text" id="title" required placeholder="例: 胸の日" class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">トレーニング日</label>
          <input type="date" id="trained-on" required class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
        </div>
      </div>
      <div id="exercises-container" class="space-y-4"></div>
      <button type="button" id="add-exercise" class="text-sm text-indigo-600 font-medium">+ 種目追加</button>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">全体メモ</label>
        <textarea id="note" rows="3" maxlength="500" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="今日のトレーニングについて…"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">画像（最大4枚）</label>
        <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center text-gray-400">
          クリックまたはドラッグでアップロード（モック・未実装）
        </div>
      </div>
      <div class="flex gap-3">
        <button type="submit" id="submit-btn" class="px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">投稿する</button>
        <a href="timeline.html" class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 inline-flex items-center">キャンセル</a>
      </div>
    </form>
  </main>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/post-form.js"></script>
  <script>
    renderNav('post');
    initPostForm({ editId: getQueryParam('edit') });
  </script>
</body>
</html>
