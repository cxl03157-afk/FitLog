<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ユーザー検索 — FitLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <div id="nav"></div>
  <main class="max-w-2xl mx-auto px-6 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">ユーザー検索</h1>
    <input type="search" id="search-input" placeholder="ユーザー名または表示名で検索…" class="w-full px-4 py-3 border border-gray-300 rounded-xl mb-4 focus:ring-2 focus:ring-indigo-500" />
    <h2 id="results-heading" class="text-sm font-semibold text-gray-500 mb-4">おすすめユーザー</h2>
    <div id="search-results" class="space-y-3"></div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/store.js?v=5"></script>
  <script src="js/common.js?v=9"></script>
  <script>
    renderNav('search');
    const input = document.getElementById('search-input');
    const heading = document.getElementById('results-heading');
    const resultsEl = document.getElementById('search-results');
    bindFollowButtons(resultsEl, () => syncFollowButtonsIn(resultsEl));

    function renderResults(q) {
      const query = (q || '').trim().toLowerCase();
      heading.textContent = query ? '検索結果' : 'おすすめユーザー';
      const users = getAllUsers().filter((u) =>
        !query || u.username.toLowerCase().includes(query) || u.displayName.toLowerCase().includes(query)
      );
      resultsEl.innerHTML = users.length ? users.map((u) => `
        <div class="flex items-center justify-between bg-white border border-gray-200 rounded-xl p-4">
          <a href="profile.html?user=${u.id}" class="flex items-center gap-3 hover:opacity-80">
            ${avatarHtml(u.avatarColor)}
            <div>
              <p class="font-semibold">${u.displayName}</p>
              <p class="text-sm text-gray-500">@${u.username}</p>
            </div>
          </a>
          ${followButtonHtml(u.id, u.following)}
        </div>
      `).join('') : '<p class="text-gray-500 text-center py-8">該当するユーザーがいません</p>';
    }

    input.addEventListener('input', () => renderResults(input.value));
    renderResults('');
    window.addEventListener('pageshow', () => renderResults(input.value));
  </script>
</body>
</html>
