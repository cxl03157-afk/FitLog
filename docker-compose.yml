services:
  postgres:
    image: postgres:17
    container_name: fitlog-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fitlog
      POSTGRES_PASSWORD: fitlog
      POSTGRES_DB: fitlog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlog -d fitlog"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: fitlog-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=ap-northeast-1
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d

volumes:
  postgres_data:
